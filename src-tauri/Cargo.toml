[package]
name = "quebracho"
version = "0.0.3"
description = "Quebracho desktop app by Yacare Studio"
authors = ["mulator <campogabriel@gmail.com>"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "quebracho_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.11.0"
notify = "8.2"
portable-pty = "0.9"
uuid = { version = "1.26", features = ["v4", "serde"] }
tiny_http = "0.12"
mime_guess = "2.0.5"
walkdir = "2.5"
regex = "1.13"
once_cell = "1.21"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "stream"] }
bytes = "1.12"
thiserror = "2.0.20"
async-trait = "0.1.92"
keyring = "4.2"
futures = "0.3.34"
tauri-plugin-clipboard-manager = "2.3.3"
urlencoding = "2.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "any", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "uuid", "json"] }
tiberius = { version = "0.12.3", features = ["tokio", "tds73"] }
tokio = { version = "1.53", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["compat"] }

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
